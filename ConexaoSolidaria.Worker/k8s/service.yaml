apiVersion: v1
kind: Service
metadata:
  name: conexao-solidaria-worker
  namespace: apps
spec:
  selector:
    app: conexao-solidaria-worker
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080
    - name: metrics
      port: 9102
      targetPort: 8080
  type: ClusterIP